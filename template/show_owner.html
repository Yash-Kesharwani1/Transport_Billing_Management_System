{% include "header.html" %}
<h4 class="mt-5 text-center">Owner Details Table</h4>
<button onclick="printTable()" class="btn">Print Table</button>
<div class="body-wrapper-inner">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="table-responsive">
                <table class="table table-bordered mt-3" id='ownerTable'>
                    <thead class="table-light">
                        <tr>
                            <th>Action</th>
                            <th>Sr. No.</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Address</th>
                            <th>Ownwer Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for owner in owners %}
                        <tr>
                            <td>
                                <a href="/edit_owner/?id={{owner.id}}"><button class="btn">Edit</button></a>
                                <a href="/delete_owner/?id={{owner.id}}"><button class="btn">Delete</button></a>
                            </td>
                            <td>{{forloop.counter}}</td>
                            <td>{{ owner.owner_name}}</td>
                            <td>{{ owner.owner_mobile }}</td>
                            <td>{{ owner.owner_type }}</td>
                            <td>{{ owner.owner_address }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
  function printTable() {
    // Clone the table
    let originalTable = document.getElementById("ownerTable");
    let clonedTable = originalTable.cloneNode(true);

    // Remove the first column from the header
    for (let row of clonedTable.rows) {
      row.deleteCell(0);
    }

    // Open print window
    let win = window.open("", "", "height=700,width=700");
    win.document.write("<html><head><title>Print Table</title>");
    win.document.write('<style>table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }</style>');
    win.document.write("</head><body>");
    win.document.write("<h4 style='text-align:center;'>Party Details Table</h4>");
    win.document.write(clonedTable.outerHTML);
    win.document.write("</body></html>");
    win.document.close();
    win.print();
  }
</script>
